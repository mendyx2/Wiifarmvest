[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_22"]

[phases.install]
cmds = [
    "cd core && composer install --no-dev --optimize-autoloader --no-interaction",
    "cd core && npm ci",
]

[phases.build]
# Compiles the React + TypeScript pages (core/resources/js) into <repo>/build
cmds = ["cd core && npm run build"]

[start]
# Members' documents go to private storage first (safe to repeat; see
# core/app/Console/Commands/MovePrivateUploads.php). A failure does not stop the site.
cmd = "php core/artisan uploads:move-private --no-interaction; php -S 0.0.0.0:${PORT:-8080} server.php"
