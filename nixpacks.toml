[phases.setup]
nixPkgs = [
    "php83",
    "php83Extensions.pdo_mysql",
    "php83Extensions.mbstring",
    "php83Extensions.openssl",
    "php83Extensions.bcmath",
    "php83Extensions.curl",
    "php83Extensions.gd",
    "php83Extensions.zip",
    "php83Packages.composer"
]

[phases.install]
cmds = [
    "cd core && composer install --no-dev --optimize-autoloader --no-interaction"
]

[start]
cmd = "php -S 0.0.0.0:${PORT:-8080} server.php"
